name: Build and test

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev patchelf xvfb webkit2gtk-driver

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests (frontend)
        run: npm test

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Type-check and bundle the frontend
        run: npm run build

      # Drives the real React app in Chrome (preinstalled on the runners) with the Tauri side scripted.
      - name: UI tests
        run: npm run test:ui

      # The desktop app downloads its own helper tools on first run, so the build is a single executable.
      - name: Build the executable
        run: npm run build:exe

      - name: Real-window tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked
          xvfb-run -a npm run test:real

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:smoke

      - name: Name the executable
        run: |
          New-Item -ItemType Directory -Force -Path ../dist-exe | Out-Null
          if ($IsWindows) { Copy-Item src-tauri/target/release/desktop.exe ../dist-exe/kaisu-windows-x64.exe }
          else { Copy-Item src-tauri/target/release/desktop ../dist-exe/kaisu-linux-x64 }

      - uses: actions/upload-artifact@v4
        with:
          name: kaisu-${{ runner.os }}
          path: dist-exe/*
          if-no-files-found: error

  # Pushing a tag like v0.0.1 publishes the executables as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, tui]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-exe
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist-exe/* --repo "$GITHUB_REPOSITORY" --title "Kaisu ${GITHUB_REF_NAME#v}" --generate-notes --prerelease

  tui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Offline tests
        run: uv run python -m unittest -v

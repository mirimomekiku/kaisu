name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev patchelf xvfb webkit2gtk-driver

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests (frontend)
        run: npm test

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Type-check and bundle the frontend
        run: npm run build

      # Drives the real React app in Chrome (preinstalled on the runners) with the Tauri side scripted.
      - name: UI tests
        run: npm run test:ui

      # The desktop app downloads its own helper tools on first run, so the build is a single executable.
      - name: Build the executable
        run: npm run build:exe

      - name: Real-window tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked
          xvfb-run -a npm run test:real

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:smoke

      - uses: actions/upload-artifact@v4
        with:
          name: kaisu-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/desktop.exe
            desktop/src-tauri/target/release/desktop
          if-no-files-found: error

  tui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Offline tests
        run: uv run python -m unittest -v

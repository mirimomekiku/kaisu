[package]
name = "desktop"
version = "0.1.0"
description = "Kaisu — a yt-dlp video downloader"
authors = ["dlord213"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-store = "2.5.0"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["process", "io-util", "sync", "time", "macros", "rt", "fs"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }


[target."cfg(unix)".dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4.46"
xz2 = "0.1.7"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true


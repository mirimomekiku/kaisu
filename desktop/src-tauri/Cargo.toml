[package]
name = "desktop"
version = "0.0.5"
description = "Kaisu — a yt-dlp video downloader"
authors = ["dlord213"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-store = "2.5.0"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["process", "io-util", "sync", "time", "macros", "rt", "fs"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "socks"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
fs4 = "1.1.0"
url = "2.5.8"
keyring = "4.2.0"
lofty = "0.25.4"
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.42"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
cap-primitives = "4.0.3"
tauri-plugin-deep-link = "2"
ed25519-dalek = "2"



[target.'cfg(not(target_os = "windows"))'.dependencies]
trash = "5.2.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_Foundation", "Win32_Devices_PortableDevices"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9.0"
tar = "0.4.46"
xz2 = "0.1.7"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

